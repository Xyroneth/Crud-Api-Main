openapi: 3.1.0
info:
  title: Task Manager API
  version: 1.0.0
  description: A production-oriented CRUD API for managing tasks.
servers:
  - url: http://localhost:3000
tags:
  - name: Tasks
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: Healthy }
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200': { description: Metrics in Prometheus text format }
  /api/v1/egg:
    get:
      summary: Easter egg
      responses:
        '200': { description: Easter egg response }
  /api/v1/tasks:
    post:
      tags: [Tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Tasks]
      summary: List tasks
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/TaskStatus' } }
        - { in: query, name: priority, schema: { $ref: '#/components/schemas/TaskPriority' } }
        - { in: query, name: search, schema: { type: string } }
        - {
            in: query,
            name: sort,
            schema:
              { type: string, enum: [createdAt, -createdAt, dueDate, -dueDate, title, -title] },
          }
      responses:
        '200':
          description: Paginated task list
          content:
            { application/json: { schema: { $ref: '#/components/schemas/TaskListResponse' } } }
  /api/v1/tasks/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Tasks]
      summary: Get a task
      responses:
        '200':
          {
            description: Task,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tasks]
      summary: Replace a task
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskInput' } } },
        }
      responses:
        '200':
          {
            description: Updated task,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tasks]
      summary: Update task fields
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskPatch' } } },
        }
      responses:
        '200':
          {
            description: Updated task,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tasks]
      summary: Delete a task
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    TaskStatus: { type: string, enum: [todo, in-progress, done] }
    TaskPriority: { type: string, enum: [low, medium, high] }
    TaskInput:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000, default: '' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        dueDate: { type: [string, 'null'], format: date-time }
    TaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        dueDate: { type: [string, 'null'], format: date-time }
    Task:
      allOf:
        - { $ref: '#/components/schemas/TaskInput' }
        - type: object
          required: [_id, createdAt, updatedAt]
          properties:
            _id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    TaskResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/Task' } }
    TaskListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Task' } }
        meta:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            pages: { type: integer }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
